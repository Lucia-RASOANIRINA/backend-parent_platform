spring.application.name=parentplatform

server.port=${PORT:8082}

# =====================================================================
#  BASE DE DONNÉES — choix automatique entre la base en ligne et locale
# =====================================================================
# app.db.mode :
#   auto   (défaut) → teste la base en ligne, bascule sur la base locale si injoignable
#   online          → force la base hébergée (Neon), celle du site déployé
#   local           → force le PostgreSQL du poste de développement
app.db.mode=${DB_MODE:auto}
app.db.probe-timeout-seconds=${DB_PROBE_TIMEOUT:5}

# --- Base en ligne (Neon.tech), partagée avec https://parentia.onrender.com ---
app.db.online.url=${DB_ONLINE_URL:jdbc:postgresql://ep-falling-hat-asyn55jo.c-4.eu-central-1.aws.neon.tech/neondb?sslmode=require}
app.db.online.username=${DB_ONLINE_USER:neondb_owner}
app.db.online.password=${DB_ONLINE_PASSWORD:npg_5jWb1QOsSnNe}

# --- Base locale (PostgreSQL du poste) ---
app.db.local.url=${DB_LOCAL_URL:jdbc:postgresql://localhost:5432/platform_parent}
app.db.local.username=${DB_LOCAL_USER:postgres}
app.db.local.password=${DB_LOCAL_PASSWORD:postgres}

# =====================================================================
#  JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# open-in-view reste activé : les contrôleurs lisent des collections liées
# (commentaires d'une publication, par exemple) après le retour du service.
spring.jpa.open-in-view=true

# =====================================================================
#  Fichiers (ressources, pièces jointes, messages vocaux)
# =====================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
file.upload-dir=./uploads
spring.servlet.multipart.location=./uploads

# =====================================================================
#  CORS — frontend local (Vite) et frontend déployé (Vercel)
# =====================================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,https://parentia-ten.vercel.app,https://*.vercel.app}

# WebSocket (chat temps réel)
spring.websocket.cors.allowed-origins=*

# =====================================================================
#  Rappels d'évènements
# =====================================================================
# Fenêtre (en heures) avant laquelle un rappel est envoyé aux inscrits
app.rappels.heures-avant=24
# Vérification périodique des rappels (toutes les 30 minutes)
app.rappels.cron=0 0/30 * * * *

# --- Traduction automatique des contenus des membres ---
# mymemory : gratuit et sans cle (defaut). google : meilleure qualite en malgache,
# clé requise mais 500 000 caracteres offerts par mois. libretranslate : instance
# auto-hebergee. aucun : desactive, seul le glossaire interne est utilise.
app.traduction.fournisseur=mymemory
# Adresse declaree a MyMemory : fait passer le quota de 5 000 a 50 000 mots par jour.
app.traduction.mymemory.email=
app.traduction.google.cle=
app.traduction.libretranslate.url=
app.traduction.timeout-ms=6000
